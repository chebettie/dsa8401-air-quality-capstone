<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Arial, Helvetica, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 1.5; }
    .t { font-size: 13px; fill: #111; text-anchor: middle; }
    .s { font-size: 11px; fill: #444; text-anchor: middle; }
    .band { font-size: 13px; font-weight: bold; fill: #222; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .dash { fill: none; stroke: #999; stroke-dasharray: 5,4; stroke-width: 1.2; }
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#333"/></marker></defs>

  <text x="20" y="24" class="band">Offline: reproducible pipeline (python run_all.py)</text>

  <rect x="20" y="45" width="150" height="70" rx="6" class="box"/>
  <text x="95" y="72" class="t">Raw hourly CSV</text><text x="95" y="90" class="s">UCI Beijing PM2.5</text><text x="95" y="104" class="s">43,824 rows, 2010 to 2014</text>

  <rect x="215" y="45" width="180" height="70" rx="6" class="box"/>
  <text x="305" y="68" class="t">data_pipeline.py</text><text x="305" y="86" class="s">timestamps, gap flags,</text><text x="305" y="100" class="s">lag, rolling, time features</text>

  <rect x="440" y="45" width="130" height="70" rx="6" class="box"/>
  <text x="505" y="76" class="t">Feature table</text><text x="505" y="94" class="s">30 columns</text>

  <rect x="620" y="30" width="200" height="50" rx="6" class="box"/>
  <text x="720" y="52" class="t">train_anomaly_model.py</text><text x="720" y="68" class="s">Isolation Forest</text>
  <rect x="620" y="95" width="200" height="50" rx="6" class="box"/>
  <text x="720" y="117" class="t">train_forecast_models.py</text><text x="720" y="133" class="s">XGBoost, 24 hours ahead</text>

  <rect x="440" y="150" width="130" height="62" rx="6" class="box"/>
  <text x="505" y="175" class="t">Evaluation</text><text x="505" y="192" class="s">backtests, anomaly</text><text x="505" y="204" class="s">checks, figures</text>

  <rect x="845" y="62" width="145" height="66" rx="6" class="box"/>
  <text x="920" y="88" class="t">models/</text><text x="920" y="106" class="s">isolation_forest.joblib</text><text x="920" y="119" class="s">xgboost_forecast.joblib</text>

  <line x1="170" y1="80" x2="212" y2="80" class="arrow"/>
  <line x1="395" y1="80" x2="437" y2="80" class="arrow"/>
  <line x1="570" y1="70" x2="617" y2="55" class="arrow"/>
  <line x1="570" y1="90" x2="617" y2="118" class="arrow"/>
  <line x1="505" y1="115" x2="505" y2="147" class="arrow"/>
  <line x1="820" y1="55" x2="842" y2="85" class="arrow"/>
  <line x1="820" y1="120" x2="842" y2="105" class="arrow"/>

  <text x="20" y="262" class="band">Online: docker compose up --build</text>
  <rect x="15" y="275" width="640" height="165" rx="10" class="dash"/>
  <text x="30" y="296" class="s" style="text-anchor:start">docker compose network</text>

  <rect x="40" y="320" width="170" height="80" rx="6" class="box"/>
  <text x="125" y="348" class="t">Streamlit interface</text><text x="125" y="366" class="s">pick an hour, view forecast</text><text x="125" y="380" class="s">and anomaly check (port 8501)</text>

  <rect x="320" y="310" width="200" height="100" rx="6" class="box"/>
  <text x="420" y="338" class="t">FastAPI service</text><text x="420" y="356" class="s">POST /forecast</text><text x="420" y="370" class="s">POST /anomaly-check</text><text x="420" y="388" class="s">(port 8000)</text>

  <rect x="740" y="325" width="200" height="70" rx="6" class="box"/>
  <text x="840" y="352" class="t">Model artifacts</text><text x="840" y="370" class="s">loaded once at API startup</text>

  <line x1="210" y1="355" x2="317" y2="355" class="arrow"/>
  <text x="263" y="345" class="s">HTTP request</text>
  <path d="M320,392 C275,418 225,418 160,402" class="arrow"/>
  <text x="240" y="428" class="s">JSON response</text>
  <line x1="740" y1="360" x2="523" y2="360" class="arrow"/>
  <path d="M920,128 C960,230 960,300 940,322" class="dash"/>
  <text x="975" y="230" class="s" style="text-anchor:end">copied into</text>
  <text x="975" y="243" class="s" style="text-anchor:end">the image</text>
</svg>
